name: Linux builder

on:
  push:
    branches: [master, linux-arm64-0118]
    paths:
      - Makefile
      - 'tools/**'
      - 'runtime/**'
      - 'updater/**'
      - 'tests/**'
      - 'third_party/**'
      - 'extras/**'
      - .github/workflows/linux-builder.yml
  pull_request:
    paths:
      - Makefile
      - 'tools/**'
      - 'runtime/**'
      - 'updater/**'
      - 'tests/**'
      - 'third_party/**'
      - 'extras/**'
      - .github/workflows/linux-builder.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-builder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Linux ${{ matrix.arch }} without game data
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the tools image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: tools
          file: tools/docker/Dockerfile
          platforms: linux/amd64
          tags: mhgurecomp-builder:ci
          load: true
          cache-from: type=gha,scope=linux-builder-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=linux-builder-${{ matrix.arch }}
      - name: Check scripts
        run: |
          bash -n tools/build-linux-release.sh tools/docker/*.sh
          shellcheck tools/build-linux-release.sh tools/docker/*.sh
      - name: Build and test without a dump
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          bash tools/build-linux-release.sh --check "$TARGET_ARCH" \
            --version 0 --jobs 2 --image mhgurecomp-builder:ci \
            --skip-image-build
      - name: Show disk use
        if: always()
        run: df -h .

  publish:
    name: Publish the tools image
    needs: check
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' ||
       github.ref == 'refs/heads/linux-arm64-0118')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Set image names
        id: names
        env:
          OWNER: ${{ github.repository_owner }}
          REVISION: ${{ github.sha }}
        run: |
          image="ghcr.io/${OWNER,,}/mhgurecomp-builder"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tools image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: tools
          file: tools/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.names.outputs.image }}:${{ steps.names.outputs.revision }}
            ${{ steps.names.outputs.image }}:linux-amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=gha,scope=linux-builder-x86_64
            type=gha,scope=linux-builder-aarch64
